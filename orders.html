<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders — GOURSHAL</title>
  <meta name="description" content="Track and manage your Gourshal orders.">
  <meta property="og:title" content="My Orders — GOURSHAL">
  <meta property="og:image" content="public/neww-logo.jpeg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
  <link rel="stylesheet" href="styles/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;400,600,1,300,400&family=Montserrat:wght@200,300,400,500,600,700&display=swap" rel="stylesheet">
  <style>
    canvas#particles-canvas{opacity:.12;}
    .orders-layout{max-width:1000px;margin:0 auto;padding:60px;}
    .orders-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:40px;flex-wrap:wrap;gap:16px;}
    .orders-header h2{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:300;}
    .order-card{background:var(--black-3);border:1px solid rgba(201,168,76,.12);margin-bottom:24px;transition:border-color .3s;}
    .order-card:hover{border-color:rgba(201,168,76,.3);}
    .order-card-header{display:flex;align-items:center;justify-content:space-between;padding:24px 28px;border-bottom:1px solid rgba(201,168,76,.08);flex-wrap:wrap;gap:12px;cursor:pointer;}
    .order-id{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:400;color:var(--gold-light);}
    .order-date{font-size:10px;color:var(--text-muted);letter-spacing:2px;margin-top:4px;}
    .order-meta{display:flex;align-items:center;gap:20px;}
    .order-total-label{font-size:10px;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;margin-bottom:4px;}
    .order-total-val{font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--gold-light);}
    .order-toggle{width:32px;height:32px;border-radius:50%;border:1px solid rgba(201,168,76,.2);background:none;color:var(--gold);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .3s;}
    .order-toggle:hover{background:rgba(201,168,76,.1);}
    .order-card-body{display:none;padding:0 28px 28px;}
    .order-card-body.open{display:block;}
    .order-item-row{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid rgba(201,168,76,.06);}
    .order-item-thumb{width:48px;height:48px;background:#ffffff;border:1px solid rgba(201,168,76,.2);border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
    .order-item-thumb img{width:100%;height:100%;object-fit:contain;padding:2px;}
    .order-item-name{flex:1;font-size:13px;color:var(--white);}
    .order-item-qty{font-size:11px;color:var(--text-muted);margin-top:3px;}
    .order-item-price{font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--gold-light);}
    .order-delivery-info{margin-top:20px;padding:16px;background:rgba(201,168,76,.04);border:1px solid rgba(201,168,76,.1);}
    .tracking-steps{display:flex;align-items:center;margin-top:16px;position:relative;}
    .tracking-step{display:flex;flex-direction:column;align-items:center;flex:1;position:relative;}
    .tracking-step-dot{width:12px;height:12px;border-radius:50%;border:2px solid rgba(201,168,76,.2);background:var(--black-3);position:relative;z-index:2;}
    .tracking-step.done .tracking-step-dot{background:var(--gold);border-color:var(--gold);}
    .tracking-step.active .tracking-step-dot{background:transparent;border-color:var(--gold);box-shadow:0 0 0 4px rgba(201,168,76,.15);}
    .tracking-step-line{position:absolute;top:6px;left:50%;right:-50%;height:2px;background:rgba(201,168,76,.1);z-index:1;}
    .tracking-step.done .tracking-step-line{background:var(--gold);}
    .tracking-step-label{font-size:9px;letter-spacing:1px;color:var(--text-muted);margin-top:8px;text-align:center;}
    .tracking-step.done .tracking-step-label,.tracking-step.active .tracking-step-label{color:var(--gold);}
    .skip-link{position:absolute;top:-40px;left:0;background:var(--gold);color:var(--black);padding:8px 16px;z-index:1000;transition:top .3s;}
    .skip-link:focus{top:0;}
    @media(max-width:700px){.orders-layout{padding:24px;}.order-card-header{flex-direction:column;align-items:flex-start;}.tracking-steps{flex-wrap:wrap;gap:20px;}.tracking-step-line{display:none;}}
  </style>
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>
<canvas id="particles-canvas" aria-hidden="true"></canvas>
<div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>
<div class="cart-pill" id="cartPill" onclick="window.location='cart.html'" role="button" aria-label="View cart" tabindex="0">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
  <span id="cartCount" aria-live="polite">0</span>
</div>
<nav id="navbar" role="navigation" aria-label="Main navigation">
  <a href="index.html" class="nav-logo">
    <img src="public/neww-logo.jpeg" alt="Gourshal" class="nav-logo-img">
    <div class="nav-logo-text-wrap"><div class="nav-logo-text">GOURSHAL</div><span class="nav-logo-tagline">CRAFTED TO LAST</span></div>
  </a>
  <ul class="nav-links" id="navLinks">
    <li><a href="index.html">Home</a></li>
    <li><a href="shop.html">Shop</a></li>
    <li><a href="orders.html" style="color:var(--gold)">My Orders</a></li>
    <li id="authNavItem"><a href="login.html" class="nav-cta">Sign In</a></li>
  </ul>
  <button class="nav-hamburger" id="navHamburger" aria-label="Menu"><span></span><span></span><span></span></button>
</nav>

<div class="page-header">
  <div class="section-label">Your Account</div>
  <h1 class="section-title">My Orders</h1>
  <p>Track and manage your Gourshal orders.</p>
</div>

<div class="orders-layout" id="ordersLayout">
  <div class="spinner" role="status" aria-label="Loading orders"></div>
</div>

<div class="cart-toast" id="cartToast" role="alert" aria-live="polite"><div class="toast-icon" aria-hidden="true">✓</div><div class="toast-text" id="toastText"></div></div>

<footer id="footer" style="margin-top:40px;">
  <div class="footer-top">
    <div class="footer-brand"><div class="footer-brand-name">GOURSHAL</div><div class="footer-brand-tag">CRAFTED TO LAST</div></div>
    <div class="footer-col"><div class="footer-col-title">Quick Links</div><ul class="footer-links"><li><a href="shop.html">Shop</a></li><li><a href="index.html">Home</a></li></ul></div>
  </div>
  <div class="footer-bottom"><div class="footer-copy">© 2026 Gourshal. All rights reserved.</div></div>
</footer>

<script src="scripts/config.js"></script>
<script src="scripts/utils.js"></script>
<script src="scripts/effects.js"></script>
<script src="scripts/products.js"></script>
<script src="scripts/cart.js"></script>
<script src="scripts/auth.js"></script>
<script>
const STATUS_MAP = { 
  pending: ['pending'], 
  confirmed: ['pending', 'confirmed'], 
  processing: ['pending', 'confirmed', 'processing'], 
  packed: ['pending', 'confirmed', 'processing', 'packed'], 
  shipped: ['pending', 'confirmed', 'processing', 'packed', 'shipped'], 
  delivered: ['pending', 'confirmed', 'processing', 'packed', 'shipped', 'delivered'],
  cancelled: []
};
const STATUS_STEPS = ['pending', 'confirmed', 'processing', 'packed', 'shipped', 'delivered'];
const STATUS_LABELS = ['Pending', 'Confirmed', 'Processing', 'Packed', 'Shipped', 'Delivered'];

document.addEventListener('DOMContentLoaded', () => {
  if (window.Effects) {
    Effects.initParticles(document.getElementById('particles-canvas'));
    Effects.initCursorGlow(document.getElementById('cursorGlow'));
  } else {
    const canvas=document.getElementById('particles-canvas'),ctx=canvas.getContext('2d');
    canvas.width=window.innerWidth;canvas.height=window.innerHeight;
    const pts=Array.from({length:40},()=>({x:Math.random()*window.innerWidth,y:Math.random()*window.innerHeight,vx:(Math.random()-.5)*.15,vy:(Math.random()-.5)*.15,r:Math.random()*.8+.2,o:Math.random()*.25+.05,g:Math.random()>.5}));
    (function anim(){ctx.clearRect(0,0,canvas.width,canvas.height);pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=canvas.width;if(p.x>canvas.width)p.x=0;if(p.y<0)p.y=canvas.height;if(p.y>canvas.height)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=p.g?`rgba(201,168,76,${p.o})`:`rgba(184,184,200,${p.o*.5})`;ctx.fill();});requestAnimationFrame(anim);})();
  }
  document.addEventListener('mousemove',e=>{document.getElementById('cursorGlow').style.left=e.clientX+'px';document.getElementById('cursorGlow').style.top=e.clientY+'px';});
  window.addEventListener('scroll',()=>document.getElementById('navbar').classList.toggle('scrolled',scrollY>60));

  // Auth guard: redirect to login if not signed in
  if (!Auth.isLoggedIn()) {
    window.location.href = 'login.html';
    return;
  }

  // Update nav cart count
  const navCc = document.getElementById('navCartCount');
  if (navCc) navCc.textContent = Cart.count();

  renderOrders();
});

async function renderOrders() {
  const layout = document.getElementById('ordersLayout');
  let orders = [];
  const apiUrl = window.Config ? Config.API_URL : 'http://localhost:5000/api';
  try {
    const token = Auth.getToken();
    if (!token) throw new Error('No token');
    const res = await fetch(apiUrl + '/orders', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    const data = await res.json();
    if (data.ok) orders = data.orders;
    else throw new Error(data.error);
  } catch(e) {
    console.warn('Backend unavailable or user not logged in, using LocalStorage orders fallback');
    orders = JSON.parse(localStorage.getItem('gourshal_orders') || '[]');
  }
  
  if (!orders.length) {
    layout.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon" role="img" aria-label="No orders">📦</div>
        <h3>No orders yet</h3>
        <p>Once you place an order, it will appear here.</p>
        <a href="shop.html" class="btn-primary" style="margin-top:24px;display:inline-block;">Start Shopping</a>
      </div>`;
    return;
  }

  layout.innerHTML = `
    <div class="orders-header">
      <h2>${orders.length} Order${orders.length>1?'s':''}</h2>
    </div>
    ${orders.map((o,i) => renderOrderCard(o,i)).join('')}`;
}

function renderOrderCard(o, i) {
  const done = STATUS_MAP[o.status] || ['confirmed'];
  const stepIdx = STATUS_STEPS.indexOf(o.status);
  const badgeClass = o.status === 'delivered' ? 'badge-green' : o.status === 'cancelled' ? 'badge-red' : ['pending', 'confirmed', 'processing'].includes(o.status) ? 'badge-gold' : 'badge-gray';

  return `
  <div class="order-card">
    <div class="order-card-header" onclick="toggleOrder(${i})" role="button" tabindex="0">
      <div>
        <div class="order-id">#${o.id}</div>
        <div class="order-date">${new Date(o.placedAt).toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})}</div>
        <div style="margin-top:8px;"><span class="badge ${badgeClass}">${o.status.toUpperCase()}</span></div>
      </div>
      <div class="order-meta">
        <div>
          <div class="order-total-label">Order Total</div>
          <div class="order-total-val">${window.Utils?.formatCurrency ? Utils.formatCurrency(o.total) : '₹' + o.total.toLocaleString()}</div>
        </div>
        <button class="order-toggle" id="toggle-${i}" aria-label="Toggle order details">▾</button>
      </div>
    </div>
    <div class="order-card-body" id="order-body-${i}">
      ${o.items.map(it => {
        const p = (window.GOURSHAL_PRODUCTS || []).find(pr=>pr.id===(it.id||it.productId));
        return `<div class="order-item-row">
          <div class="order-item-thumb">${p && p.image ? `<img src="${p.image}" alt="${it.name}">` : '🌿'}</div>
          <div class="order-item-name">${it.name}<div class="order-item-qty">${it.unit || ''} · Qty ${it.qty}</div></div>
          <div class="order-item-price">${window.Utils?.formatCurrency ? Utils.formatCurrency(it.price*it.qty) : '₹' + (it.price*it.qty).toLocaleString()}</div>
        </div>`;
      }).join('')}
      <div class="order-delivery-info">
        <div style="font-size:10px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-bottom:12px;">Tracking</div>
        <div class="tracking-steps">
          ${STATUS_STEPS.map((s,si) => {
            const isDone = done.includes(s);
            const isActive = si === stepIdx;
            const isLast = si === STATUS_STEPS.length - 1;
            return `<div class="tracking-step${isDone?' done':''}${isActive&&!isDone?' active':''}">
              ${!isLast?`<div class="tracking-step-line ${isDone?'done':''}"></div>`:''}
              <div class="tracking-step-dot" aria-hidden="true"></div>
              <div class="tracking-step-label">${STATUS_LABELS[si]}</div>
            </div>`;
          }).join('')}
        </div>
        <div style="margin-top:20px;font-size:11px;color:var(--text-muted);line-height:2;">
          <strong style="color:var(--white);">Deliver to:</strong><br>
          ${o.address.firstName} ${o.address.lastName} · ${o.address.phone}<br>
          ${o.address.addr1}${o.address.addr2?', '+o.address.addr2:''}<br>
          ${o.address.city}, ${o.address.state} — ${o.address.pin}
        </div>
        ${o.expectedDelivery?`<div style="margin-top:12px;font-size:11px;color:var(--text-muted);">Expected delivery: <strong style="color:var(--gold);">${o.expectedDelivery}</strong></div>`:''}
      </div>
      <div style="display:flex;gap:12px;margin-top:20px;flex-wrap:wrap;">
        <a href="shop.html" class="btn-secondary" style="padding:10px 20px;font-size:10px;">Reorder</a>
        <button onclick="downloadInvoice('${o.id}')" class="btn-secondary" style="padding:10px 20px;font-size:10px;">Download Invoice</button>
      </div>
    </div>
  </div>`;
}

function toggleOrder(i) {
  const body = document.getElementById('order-body-'+i);
  const btn = document.getElementById('toggle-'+i);
  const open = body.classList.toggle('open');
  btn.textContent = open ? '▴' : '▾';
}

function downloadInvoice(orderId) {
  const orders = JSON.parse(localStorage.getItem('gourshal_orders') || '[]');
  const o = orders.find(x => x.id === orderId);
  if (!o) return;
  const content = `GOURSHAL — INVOICE\n${'─'.repeat(40)}\nOrder ID: #${o.id}\nDate: ${new Date(o.placedAt).toLocaleDateString()}\n\nItems:\n${o.items.map(i=>`  ${i.name} (${i.unit}) × ${i.qty} = ${window.Utils?.formatCurrency ? Utils.formatCurrency(i.price*i.qty) : '₹' + (i.price*i.qty).toLocaleString()}`).join('\n')}\n\nSubtotal: ${window.Utils?.formatCurrency ? Utils.formatCurrency(o.subtotal) : '₹' + o.subtotal.toLocaleString()}\nShipping: ${window.Utils?.formatCurrency ? Utils.formatCurrency(o.shipping) : '₹' + o.shipping}\nTotal: ${window.Utils?.formatCurrency ? Utils.formatCurrency(o.total) : '₹' + o.total.toLocaleString()}\n\nDeliver to:\n${o.address.firstName} ${o.address.lastName}\n${o.address.addr1}\n${o.address.city}, ${o.address.state} ${o.address.pin}\n\nThank you for choosing Gourshal!\nCrafted to Last.`;
  const blob = new Blob([content], {type:'text/plain'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Gourshal-Invoice-${orderId}.txt`; a.click();
}
</script>
</body>
</html>
